<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <script type="module" src="./js/cadastro.js" defer></script>
    <title>cadastrar Pessoa</title>
</head>

<body>

<main class="container">
    <h1>Cadastrar Pessoas</h1>
    <form action="" id="formCadastro">
        <label for="nome">Nome</label>
        <input type="text" id="nome" required maxlength="100">

        <label for="idade"></label>
        <input type="number" id="idade" required max="130">

        <div class="acoes">
            <button type="submit">Cadastrar</button>
            <a href="index.html" class="botao secundario">Cancelar</a>
        </div>
    </form>
    <p id="mensagem" role="status"></p>
</main>

</body>

</html>
